events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;          # no revelar la versión de nginx

    # Límite de subida: los Excel institucionales pesan pocos MB
    client_max_body_size 12M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;

        # Cabeceras de seguridad básicas
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;

        # ── API ────────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;   # la generación con IA puede tardar
        }

        # ── IMPORTANTE ─────────────────────────────────────────────────────
        # Los .docx NO se sirven como archivos estáticos.
        #
        # En la configuración de desarrollo, `/static/docx/` estaba expuesto sin
        # autenticación: cualquiera con la URL podía descargar un informe con
        # notas de estudiantes. Aquí se bloquea: las descargas pasan por
        # `GET /api/v1/informes/{id}/descargar`, que valida el JWT y el rol.
        location /static/ {
            return 404;
        }

        # La documentación de la API no se publica en producción.
        location /docs      { return 404; }
        location /redoc     { return 404; }
        location = /openapi.json { return 404; }

        # ── Frontend (build estático de Vite) ──────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        # Los assets con hash en el nombre se pueden cachear indefinidamente
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # SPA: cualquier ruta desconocida la resuelve React Router
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
