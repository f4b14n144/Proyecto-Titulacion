events {
    worker_connections 1024;
}

http {
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:5173;
    }

    server {
        listen 80;

        # API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Documentación FastAPI
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend;
        }

        # Los .docx NO se sirven como estáticos: contienen notas de estudiantes y
        # aquí quedaban accesibles SIN autenticación con solo adivinar el nombre.
        # Se descargan por la API, que valida el JWT y el rol:
        #   GET /api/v1/informes/{id}/descargar
        location /static/ {
            return 404;
        }

        # Frontend (todo lo demás)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
